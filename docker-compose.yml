services:
  db:
    image: postgres:16
    profiles: ["local"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apt_pass}
      POSTGRES_DB: ${POSTGRES_DB:-apt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - apt_pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro   # sql/ 폴더 전체 연결 — 비어 있어도 DB가 정상 기동
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apt_user} -d ${POSTGRES_DB:-apt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.63.19.1
    profiles: ["local", "aws"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
        required: false

volumes:
  apt_pgdata:
